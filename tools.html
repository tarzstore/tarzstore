<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Tarz Store — Upload ke Supabase</title>
<style>
  :root{
    --bg:#08080a;
    --panel:#111114;
    --panel-2:#15151a;
    --inset:#1a1a1f;
    --border:#242429;
    --border-soft:#1c1c21;
    --text:#f5f5f7;
    --muted:#93939d;
    --muted-dim:#5c5c66;
    --accent:#6366f1;
    --accent-2:#8b8cf7;
    --accent-soft:rgba(99,102,241,.10);
    --accent-border:rgba(99,102,241,.38);
    --gold:#f0b429;
    --gold-soft:rgba(240,180,41,.10);
    --ok:#22c55e;
    --ok-soft:rgba(34,197,94,.12);
    --err:#f43f5e;
    --warn:#eab308;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 20px -14px rgba(0,0,0,.45);
    --shadow-card-hover:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 26px -16px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html{background:var(--bg); touch-action:pan-x pan-y; -ms-touch-action:pan-x pan-y;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--bg);
    touch-action:pan-x pan-y;
    background-image:
      radial-gradient(circle at 15% -5%, rgba(99,102,241,.09), transparent 42%),
      radial-gradient(circle at 105% 10%, rgba(139,140,247,.05), transparent 45%);
    background-attachment:fixed;
    color:var(--text);
    padding:36px 18px 96px;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .shell{max-width:480px;margin:0 auto;}

  /* ── Header ── */
  .topline{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:.66rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted-dim);
    margin-bottom:16px;
  }
  .topline .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 0 3px var(--ok-soft);
    flex-shrink:0;
    animation:pulse-dot 3s ease-in-out infinite;
  }
  @keyframes pulse-dot{
    0%,100%{opacity:1;}
    50%{opacity:.7;}
  }

  h1{
    font-size:1.68rem;
    font-weight:800;
    letter-spacing:-.03em;
    line-height:1.15;
    margin:0 0 6px;
    background:linear-gradient(135deg, #ffffff 20%, #b8b9f4 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .subhead{
    font-size:.85rem;
    color:var(--muted);
    margin:0 0 28px;
    letter-spacing:-.005em;
  }

  /* ── Flow: numbered steps with connecting rail (fills as steps complete) ── */
  .flow{
    position:relative;
    padding-left:36px;
  }
  .flow::before{
    content:'';
    position:absolute;
    left:11px;
    top:14px;
    bottom:14px;
    width:2px;
    border-radius:2px;
    background:var(--border-soft);
  }
  .flow::after{
    content:'';
    position:absolute;
    left:11px;
    top:14px;
    width:2px;
    border-radius:2px;
    height:calc(100% - 28px);
    background:linear-gradient(var(--accent), var(--accent-2) 60%, transparent);
    transition:height .3s ease;
  }
  .step{
    position:relative;
    margin-bottom:18px;
  }
  .step-num{
    position:absolute;
    left:-36px;
    top:3px;
    width:24px;
    height:24px;
    border-radius:7px;
    background:var(--panel);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--mono);
    font-size:.66rem;
    font-weight:600;
    color:var(--muted);
    z-index:1;
    transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .step-num.done{
    color:#fff;
    border-color:var(--accent-2);
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 0 0 3px var(--accent-soft);
  }

  .card{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px 20px 18px;
    box-shadow:var(--shadow-card);
    transition:box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover{
    border-color:#2c2c33;
    box-shadow:var(--shadow-card-hover);
  }

  .card-label{
    font-family:var(--mono);
    font-size:.66rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted-dim);
    margin:0 0 13px;
    display:block;
  }

  input[type=text], select{
    width:100%;
    background:var(--inset);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 13px;
    color:var(--text);
    font-size:.88rem;
    font-family:var(--sans);
    margin-bottom:14px;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input[type=text]::placeholder{color:var(--muted-dim);}
  input[type=text]:hover, select:hover{border-color:#323238;}
  input[type=text]:focus, select:focus{
    outline:none;
    border-color:var(--accent-border);
    box-shadow:0 0 0 3px var(--accent-soft);
    background:#1c1c22;
  }
  select{-webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%2393939d'><path d='M5.5 7.5l4.5 4.5 4.5-4.5' stroke='%2393939d' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 13px center;
    padding-right:36px;
    cursor:pointer;
  }
  select option{background:var(--inset);}
  input[type=file]{
    display:none;
  }
  .filepicker-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .filepicker-btn{
    background:var(--inset);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:7px;
    padding:9px 14px;
    font-size:.8rem;
    font-weight:600;
    cursor:pointer;
    width:auto;
    box-shadow:none;
    transition:border-color .15s, background .15s;
  }
  .filepicker-btn:hover{border-color:var(--accent-border);background:#1f1f26;filter:none;}
  .filepicker-status{
    color:var(--muted);
    font-size:.82rem;
    font-family:var(--sans);
  }

  button{
    background:linear-gradient(135deg, var(--accent), #5457e0);
    color:#fff;
    border:1px solid rgba(255,255,255,.08);
    border-radius:9px;
    padding:13px 18px;
    font-size:.88rem;
    font-weight:650;
    width:100%;
    cursor:pointer;
    letter-spacing:-.005em;
    box-shadow:0 1px 0 rgba(255,255,255,.15) inset, 0 4px 10px -6px rgba(99,102,241,.4);
    transition:filter .15s ease, transform .1s ease, box-shadow .2s ease;
  }
  button:hover{filter:brightness(1.06);}
  button:active{filter:brightness(.95);transform:translateY(1px);}
  button.secondary{
    background:var(--inset);
    border:1px solid var(--border);
    color:var(--text);
    box-shadow:none;
  }
  button.secondary:hover{filter:none;border-color:#3a3a42;background:#1f1f26;box-shadow:none;}
  button:disabled{opacity:.45;cursor:default;transform:none;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}

  /* ── Account form ── */
  #accountForm{
    display:none;
    margin-top:16px;
    border-top:1px solid var(--border-soft);
    padding-top:16px;
  }

  /* ── File list ── */
  .filelist{margin-top:15px;}
  .fileitem{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:9px;
    padding:12px 0;
    border-bottom:1px solid var(--border-soft);
    font-size:.85rem;
  }
  .fileitem:last-child{border-bottom:none;}
  .fname-edit{
    flex:1;
    min-width:120px;
    background:var(--inset);
    border:1px solid var(--border);
    border-radius:6px;
    padding:8px 10px;
    color:var(--text);
    font-family:var(--mono);
    font-size:.78rem;
    margin:0;
    transition:border-color .15s, box-shadow .15s;
  }
  .fname-edit:focus{outline:none;border-color:var(--accent-border);box-shadow:0 0 0 3px var(--accent-soft);}
  .status{
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.01em;
    white-space:nowrap;
    font-weight:600;
  }
  .status.pending{color:var(--muted-dim);}
  .status.uploading{color:var(--accent-2);}
  .status.ok{color:var(--ok);}
  .status.err{color:var(--err);}

  .copybtn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--accent-2);
    border-radius:6px;
    padding:6px 11px;
    font-family:var(--mono);
    font-size:.72rem;
    font-weight:700;
    width:auto;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:none;
    transition:border-color .15s, color .15s, background .15s;
  }
  .copybtn:hover{border-color:var(--accent-border);background:var(--accent-soft);filter:none;}
  .copybtn.copied{color:var(--ok);border-color:rgba(34,197,94,.4);background:var(--ok-soft);}

  /* ── Tombol X kembali ke admin ── */
  .close-admin-btn{
    position:fixed;top:18px;right:18px;z-index:200;
    width:38px;height:38px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
    text-decoration:none;cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.03) inset;
    transition:background .15s ease,color .15s ease,border-color .15s ease,transform .15s ease;
  }
  .close-admin-btn:hover{color:var(--text);border-color:var(--accent-border);background:#1c1c22;}
  .close-admin-btn:active{transform:scale(.94);}
  .close-admin-btn svg{width:18px;height:18px;flex-shrink:0;}

  /* ── Footer note ── */
  .foot{
    margin-top:30px;
    text-align:center;
    font-family:var(--mono);
    font-size:.66rem;
    letter-spacing:.06em;
    color:var(--muted-dim);
  }

  @media(min-width:520px){
    body{padding:56px 24px 96px;}
    h1{font-size:1.9rem;}
  }
</style>
</head>
<body>

<a href="admin.html" class="close-admin-btn" title="Kembali ke Admin Panel" aria-label="Kembali ke Admin Panel">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</a>


<div class="shell">

<div class="topline"><span class="dot"></span>SUPABASE STORAGE UPLOADER</div>
<h1>Upload ke Supabase Storage</h1>
<p class="subhead">Kelola akun, pilih bucket, dan kirim file dalam tiga langkah.</p>

<div class="flow">

  <div class="step">
    <div class="step-num done">01</div>
    <div class="card">
      <span class="card-label">Akun Supabase</span>
      <select id="accountSelect"></select>

      <div class="grid2">
        <button class="secondary" id="editAccountBtn" type="button">Edit akun ini</button>
        <button class="secondary" id="newAccountBtn" type="button">+ Tambah akun</button>
      </div>

      <div id="accountForm">
        <input type="text" id="accName" placeholder="Nama label">
        <input type="text" id="accUrl" placeholder="Project URL">
        <input type="text" id="accKey" placeholder="Anon / Publishable Key">

        <div class="grid2">
          <button id="saveAccountBtn" type="button">Simpan akun</button>
          <button class="secondary" id="deleteAccountBtn" type="button">Hapus akun</button>
        </div>
      </div>
    </div>
  </div>

  <div class="step">
    <div class="step-num done">02</div>
    <div class="card">
      <span class="card-label">Tujuan Bucket</span>

      <input type="text" id="bucketName" placeholder="Nama bucket">
      <input type="text" id="bucketPath" placeholder="Folder (opsional)">

      <select id="cacheDuration">
        <option value="31536000">Cache 1 tahun</option>
        <option value="2592000">Cache 30 hari</option>
        <option value="604800" selected>Cache 7 hari</option>
        <option value="86400">Cache 1 hari</option>
      </select>
    </div>
  </div>

  <div class="step">
    <div class="step-num">03</div>
    <div class="card">
      <span class="card-label">File</span>
      <input type="file" id="fileInput" multiple>
      <div class="filepicker-row">
        <button type="button" class="filepicker-btn" id="filePickerBtn">Pilih File</button>
        <span class="filepicker-status" id="filePickerStatus">Belum ada file dipilih</span>
      </div>

      <div class="filelist" id="fileList"></div>

      <div style="margin-top:18px;">
        <button id="uploadBtn">Upload Semua</button>
      </div>
    </div>
  </div>

</div>

<div class="foot">Data akun tersimpan lokal di perangkat ini</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const STORAGE_KEY = 'tarz_supabase_accounts_v1';

function loadAccounts(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveAccounts(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

let accounts = loadAccounts();

// Seed akun pertama otomatis kalau belum ada apa-apa tersimpan
if(accounts.length === 0){
  accounts.push({
    id: 'seed-1',
    name: 'Akun Utama',
    url: 'https://xxaenbqyeliyhrulyjuz.supabase.co',
    key: 'sb_publishable_ESX2hBULGNDIIcF5QFycIw_cIR5qf3A'
  });
  saveAccounts(accounts);
}

const accountSelect = document.getElementById('accountSelect');
const accountForm = document.getElementById('accountForm');
const accName = document.getElementById('accName');
const accUrl = document.getElementById('accUrl');
const accKey = document.getElementById('accKey');
const bucketNameInput = document.getElementById('bucketName');
const bucketPathInput = document.getElementById('bucketPath');

function renderAccountSelect(){
  accountSelect.innerHTML = '';
  accounts.forEach(acc => {
    const opt = document.createElement('option');
    opt.value = acc.id;
    opt.textContent = acc.name;
    accountSelect.appendChild(opt);
  });
}

function getSelectedAccount(){
  const id = accountSelect.value;
  return accounts.find(a => a.id === id);
}

accountSelect.addEventListener('change', () => {
  accountForm.style.display = 'none';
});

document.getElementById('newAccountBtn').addEventListener('click', () => {
  accName.value = '';
  accUrl.value = '';
  accKey.value = '';
  accountForm.dataset.mode = 'new';
  accountForm.style.display = 'block';
});

document.getElementById('editAccountBtn').addEventListener('click', () => {
  const acc = getSelectedAccount();
  if(!acc){ alert('Belum ada akun untuk diedit.'); return; }
  accName.value = acc.name;
  accUrl.value = acc.url;
  accKey.value = acc.key;
  accountForm.dataset.mode = 'edit';
  accountForm.dataset.editId = acc.id;
  accountForm.style.display = 'block';
});

document.getElementById('saveAccountBtn').addEventListener('click', () => {
  const name = accName.value.trim();
  const url = accUrl.value.trim().replace(/\/+$/, '');
  const key = accKey.value.trim();

  if(!name || !url || !key){
    alert('Isi semua field dulu (nama, URL, key).');
    return;
  }
  if(!/^https:\/\/.+\.supabase\.co$/.test(url)){
    alert('Format Project URL sepertinya kurang tepat. Contoh yang benar: https://xxxxxxx.supabase.co');
    return;
  }

  if(accountForm.dataset.mode === 'edit'){
    const id = accountForm.dataset.editId;
    const acc = accounts.find(a => a.id === id);
    acc.name = name; acc.url = url; acc.key = key;
  } else {
    accounts.push({ id: 'acc-' + Date.now(), name, url, key });
  }
  saveAccounts(accounts);
  renderAccountSelect();
  accountSelect.value = accountForm.dataset.mode === 'edit' ? accountForm.dataset.editId : accounts[accounts.length-1].id;
  accountForm.style.display = 'none';
});

document.getElementById('deleteAccountBtn').addEventListener('click', () => {
  const acc = getSelectedAccount();
  if(!acc) return;
  if(!confirm('Hapus akun "' + acc.name + '" dari daftar tersimpan?')) return;
  accounts = accounts.filter(a => a.id !== acc.id);
  saveAccounts(accounts);
  renderAccountSelect();
  accountForm.style.display = 'none';
});

renderAccountSelect();

// ── Upload logic ──
const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const uploadBtn = document.getElementById('uploadBtn');
const filePickerBtn = document.getElementById('filePickerBtn');
const filePickerStatus = document.getElementById('filePickerStatus');

let selectedFiles = [];

filePickerBtn.addEventListener('click', () => {
  fileInput.click();
});

fileInput.addEventListener('change', () => {
  selectedFiles = Array.from(fileInput.files);
  filePickerStatus.textContent = selectedFiles.length === 0
    ? 'Belum ada file dipilih'
    : (selectedFiles.length === 1 ? selectedFiles[0].name : selectedFiles.length + ' file dipilih');
  renderFileList();
});

function renderFileList(){
  fileListEl.innerHTML = '';
  selectedFiles.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'fileitem';
    item.innerHTML = `
      <input type="text" class="fname-edit" id="fname-${i}" value="${f.name}">
      <span class="status pending" id="status-${i}">Menunggu</span>
      <span id="copywrap-${i}"></span>
    `;
    fileListEl.appendChild(item);
  });
}

function setStatus(i, text, cls){
  const el = document.getElementById('status-' + i);
  if(!el) return;
  el.textContent = text;
  el.className = 'status ' + cls;
}

function showCopyButton(i, url){
  const wrap = document.getElementById('copywrap-' + i);
  if(!wrap) return;
  wrap.innerHTML = '';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'copybtn';
  btn.textContent = 'Salin URL';
  btn.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(url);
      btn.textContent = 'Tersalin ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Salin URL';
        btn.classList.remove('copied');
      }, 1800);
    }catch(e){
      // Fallback kalau clipboard API tidak tersedia
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try{
        document.execCommand('copy');
        btn.textContent = 'Tersalin ✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Salin URL';
          btn.classList.remove('copied');
        }, 1800);
      }catch(e2){
        alert('Gagal menyalin. URL: ' + url);
      }
      document.body.removeChild(ta);
    }
  });
  wrap.appendChild(btn);
}

uploadBtn.addEventListener('click', async () => {
  const acc = getSelectedAccount();
  if(!acc){
    alert('Pilih atau tambahkan akun dulu.');
    return;
  }
  const bucketName = bucketNameInput.value.trim();
  if(!bucketName){
    alert('Isi nama bucket dulu.');
    return;
  }
  if(selectedFiles.length === 0){
    alert('Pilih file dulu.');
    return;
  }

  const client = supabase.createClient(acc.url, acc.key);
  const folder = bucketPathInput.value.trim().replace(/^\/+|\/+$/g, '');
  const cacheDuration = document.getElementById('cacheDuration').value;

  uploadBtn.disabled = true;
  uploadBtn.textContent = 'Mengupload...';

  for(let i = 0; i < selectedFiles.length; i++){
    const file = selectedFiles[i];
    const nameInput = document.getElementById('fname-' + i);
    const finalName = (nameInput ? nameInput.value.trim() : file.name) || file.name;
    const path = folder ? `${folder}/${finalName}` : finalName;
    setStatus(i, 'Mengupload...', 'uploading');

    try{
      const { error } = await client.storage
        .from(bucketName)
        .upload(path, file, {
          cacheControl: cacheDuration,
          upsert: true,
          contentType: file.type || undefined
        });

      if(error){
        setStatus(i, 'Gagal: ' + error.message, 'err');
      } else {
        setStatus(i, 'Berhasil ✓', 'ok');
        const { data: publicUrlData } = client.storage
          .from(bucketName)
          .getPublicUrl(path);
        if(publicUrlData && publicUrlData.publicUrl){
          showCopyButton(i, publicUrlData.publicUrl);
        }
      }
    } catch(e){
      setStatus(i, 'Gagal: ' + e.message, 'err');
    }
  }

  uploadBtn.disabled = false;
  uploadBtn.textContent = 'Upload Semua';
});
</script>

</body>
</html>
