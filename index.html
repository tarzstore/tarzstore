<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8fb4d9">
<title>TARZ STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{color-scheme:light;--ink:#000;--bg:#8fb4d9;--blue:#3b6ea8;--glow:#1f4e8c;--tint:#e4eef8;--yellow:#f0c75a;--white:#fff;
--head:"Archivo Black",Impact,system-ui,sans-serif;--body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;overflow-x:hidden;padding:30px 16px 0;color:var(--ink);font:500 15px/1.4 var(--body)}
/* latar (grid + gradasi) = 1 layer fixed yang di-composite sekali, tidak digambar ulang saat scroll */
body::before{content:"";position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:-1;pointer-events:none;transform:translateZ(0);
  background-image:radial-gradient(600px 380px at 85% -5%,rgba(59,110,168,.35),transparent 70%),
  linear-gradient(rgba(0,0,0,.07) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(0,0,0,.07) 1.5px,transparent 1.5px);
  background-size:auto,32px 32px,32px 32px}
/* sorotan cahaya: digerakkan lewat transform (GPU), bukan lewat gradient background */
#spot{position:fixed;left:0;top:0;width:840px;height:840px;margin:-420px 0 0 -420px;z-index:0;pointer-events:none;will-change:transform;
  background:radial-gradient(circle closest-side,rgba(255,255,255,.4),transparent 70%)}
main{position:relative;z-index:1;width:100%;max-width:420px;margin:0 auto}

/* dekorasi */
.o{position:fixed;z-index:0;pointer-events:none;will-change:transform}
.o svg{display:block;width:100%;height:100%;fill:var(--c,var(--white));stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;overflow:visible}
.o polygon{fill:var(--c,var(--white))}
.spin{animation:spin var(--t,20s) linear infinite}
.bob{animation:bob var(--t,5s) ease-in-out infinite alternate}
.twinkle{animation:twinkle 2.2s ease-in-out infinite}
.half{border:3px solid var(--ink);border-radius:50%;background:radial-gradient(var(--ink) 1.7px,transparent 2.2px) 0 0/10px 10px,var(--yellow);box-shadow:4px 4px 0 var(--blue);opacity:.9}
.check{border:3px solid var(--ink);background:conic-gradient(var(--ink) 25%,var(--tint) 0 50%,var(--ink) 0 75%,var(--tint) 0) 0 0/24px 24px;box-shadow:4px 4px 0 var(--yellow);opacity:.85}

.ring{width:100%;height:100%;border-radius:50%;border:11px solid var(--yellow);box-shadow:0 0 0 3px var(--ink),inset 0 0 0 3px var(--ink)}
.pill{border:3px solid var(--ink);border-radius:999px;background:var(--tint);box-shadow:4px 4px 0 var(--blue)}
.dots{background:radial-gradient(var(--ink) 2.2px,transparent 2.8px) 0 0/14px 14px;opacity:.55}
.drift{animation:drift var(--t,9s) ease-in-out infinite alternate}
.tilt{animation:tilt var(--t,6s) ease-in-out infinite alternate}

/* header */
header{margin-bottom:34px;text-align:center}
.brandwrap{position:relative;display:inline-block}
.brand{position:relative;overflow:hidden;display:inline-block;padding:13px 24px 10px;border:3px solid var(--ink);border-radius:14px;
  background:linear-gradient(135deg,#3b6ea8,#5a8fc7);color:var(--white);font:400 clamp(28px,9vw,38px)/1 var(--head);letter-spacing:.04em;text-transform:uppercase;
  text-shadow:2px 2px 0 var(--ink);box-shadow:6px 6px 0 var(--yellow),6px 6px 0 3px var(--ink),0 0 46px rgba(59,110,168,.65);
  transform:rotate(-2deg);animation:slam .7s cubic-bezier(.3,1.6,.5,1) both}
.brand::after{content:"";position:absolute;top:0;bottom:0;left:0;width:36%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-167%) skewX(-18deg);animation:shine 3.6s 1.2s ease-in-out infinite;will-change:transform}
.spk{position:absolute;width:26px;height:26px;fill:var(--yellow);stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.spk.a{top:-16px;right:-14px;animation:twinkle 2.2s ease-in-out infinite}
.spk.b{bottom:-8px;left:-16px;width:20px;height:20px;animation:twinkle 2.2s .8s ease-in-out infinite}
h1{display:flex;align-items:center;gap:8px;width:max-content;max-width:100%;margin:26px auto 0;padding:6px 14px;border-radius:999px;border:2px solid rgba(0,0,0,.22);background:rgba(255,255,255,.55);
  font:700 13px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;animation:slam .7s .12s cubic-bezier(.3,1.6,.5,1) both}
.dot{position:relative;width:9px;height:9px;border-radius:50%;background:var(--yellow)}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(240,199,90,.7);animation:ping 1.8s infinite}
.sub{margin:12px 0 0;color:rgba(0,0,0,.65);font-size:14px}

/* kartu */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px 16px}
@media (hover:hover) and (pointer:fine){.grid{perspective:900px}.tile{transform:rotate(var(--r)) rotateX(var(--rx)) rotateY(var(--ry))}}
.tile{--r:-.8deg;--rx:0deg;--ry:0deg;--sh:var(--yellow);position:relative;display:flex;flex-direction:column;gap:10px;padding:10px;border:3px solid var(--ink);border-radius:18px;background:var(--white);color:var(--ink);
  box-shadow:6px 6px 0 var(--sh),6px 6px 0 3px var(--ink);transform:rotate(var(--r));transition:transform .18s ease-out,box-shadow .18s;
  animation:pop .6s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(.2s + var(--i) * .09s)}
.tile:nth-child(even){--r:.8deg;--sh:var(--blue)}
.tile:hover{box-shadow:10px 10px 0 var(--sh),10px 10px 0 3px var(--ink),0 18px 40px rgba(59,110,168,.4)}
.free{position:absolute;z-index:2;top:-13px;right:-9px;padding:4px 9px 3px;border:3px solid var(--ink);border-radius:8px;background:var(--yellow);color:var(--ink);font:400 11px/1 var(--head);letter-spacing:.06em;transform:rotate(7deg);box-shadow:2px 2px 0 var(--ink);animation:wiggle 3s ease-in-out infinite}
.logo{position:relative;width:100%;aspect-ratio:1;border:3px solid var(--ink);border-radius:11px;overflow:hidden;display:grid;place-items:center;background:var(--tint);color:var(--blue);font:400 30px/1 var(--head)}
.logo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s}
.tile:hover .logo::after{transform:translateX(120%)}
.tile:hover .logo img{transform:scale(1.08) rotate(-1deg)}
.name{display:grid;place-items:center;min-height:1.6em;padding:2px 0 0;font:400 19px/1.2 var(--head);text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden}
.tile:hover .name{color:var(--blue)}
.btns{display:grid;gap:10px}
.go{height:42px;display:flex;align-items:center;justify-content:center;gap:7px;border:3px solid var(--ink);border-radius:10px;background:var(--blue);color:var(--white);
  font:700 13px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:background .15s,color .15s,transform .12s,box-shadow .12s}
.go svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:square;stroke-linejoin:miter;transition:transform .15s}
.go:hover,.go:focus-visible{background:var(--ink)}
.go:hover svg{transform:translateX(3px)}
.go.install{background:var(--yellow);color:var(--ink)}
.go.install:hover,.go.install:focus-visible{background:var(--white)}
.go.install:hover svg{transform:translateY(3px)}
.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.go:focus-visible,.tut:focus-visible{outline:3px solid var(--glow);outline-offset:3px}

/* skeleton */
.sk{border-radius:18px;height:300px;border:3px solid rgba(0,0,0,.12);background:linear-gradient(100deg,rgba(255,255,255,.2) 30%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.2) 70%) 0 0/300% 100%;animation:sheen 1.3s linear infinite}

/* tutorial */
.tutwrap{position:relative;z-index:1;max-width:420px;margin:34px auto 0}
.tut{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border:3px solid var(--ink);border-radius:14px;background:var(--yellow);color:var(--ink);text-decoration:none;
  font:400 17px/1 var(--head);text-transform:uppercase;box-shadow:5px 5px 0 var(--blue),5px 5px 0 3px var(--ink);transform:rotate(-.8deg);animation:pop .6s .15s cubic-bezier(.3,1.5,.5,1) backwards;transition:background .15s,transform .12s,box-shadow .12s}
.tut .pl{flex:none;width:30px;height:30px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:8px;background:var(--blue);box-shadow:2px 2px 0 var(--ink);animation:beat 1.6s ease-in-out infinite}
.tut .pl svg{width:12px;height:12px;fill:var(--white);margin-left:2px}
.tut:hover{background:var(--white)}
.tut:active{transform:translate(3px,3px) rotate(-.8deg);box-shadow:1px 1px 0 var(--ink)}

/* tombol BUY KEY VIP */
.tut.buy{--r:.8deg;margin-top:20px;background:var(--blue);color:var(--white);box-shadow:5px 5px 0 var(--yellow),5px 5px 0 3px var(--ink);transform:rotate(.8deg);animation-delay:.3s}
.tut.buy .pl{background:var(--yellow);animation-delay:.4s}
.tut.buy .pl svg{width:16px;height:16px;margin:0;fill:var(--ink)}
.tut.buy:hover,.tut.buy:focus-visible{background:var(--ink)}
.tut.buy:active{transform:translate(3px,3px) rotate(.8deg);box-shadow:1px 1px 0 var(--ink)}

/* modal video tutorial */
button.tut{appearance:none;-webkit-appearance:none;padding:0;cursor:pointer}
.vmodal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.72)}
.vmodal[hidden]{display:none}
.vbox{width:100%;max-width:420px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--white);box-shadow:6px 6px 0 var(--yellow),6px 6px 0 3px var(--ink);animation:pop .35s cubic-bezier(.3,1.5,.5,1) backwards}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;border-bottom:3px solid var(--ink);background:var(--yellow);font:400 15px/1 var(--head);text-transform:uppercase}
.vx{flex:none;width:34px;height:34px;display:grid;place-items:center;padding:0;border:3px solid var(--ink);border-radius:9px;background:var(--blue);color:var(--white);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.vx svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:square}
.vx:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.vx:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.vbox video{display:block;width:100%;max-height:calc(100vh - 150px);max-height:calc(100svh - 150px);background:#000;object-fit:contain}

/* ticker */
.ticker-wrap{overflow:hidden;margin:0 -16px;padding:50px 0 48px}
.ticker{position:relative;z-index:1;margin:0 -24px;padding:12px 0 10px;overflow:hidden;border-block:3px solid var(--ink);background:var(--yellow);color:var(--ink);transform:rotate(-1.5deg);box-shadow:0 6px 0 var(--blue)}
.ticker.rev{margin-top:14px;background:var(--blue);color:var(--white);transform:rotate(1.2deg);box-shadow:0 6px 0 var(--ink)}
.track{display:flex;width:max-content;will-change:transform;animation:marquee 16s linear infinite}
.rev .track{animation-direction:reverse;animation-duration:20s}
.track span{flex:none;padding:0 14px;font:400 18px/1 var(--head);letter-spacing:.08em;white-space:nowrap}

@keyframes drift{to{translate:26px 0}}
@keyframes tilt{from{rotate:-14deg}to{rotate:14deg}}
@keyframes slam{from{opacity:0;transform:translateY(-24px) rotate(-8deg) scale(1.3)}}
@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.8) rotate(var(--r))}}
@keyframes bob{to{translate:0 -14px}}
@keyframes spin{to{rotate:360deg}}
@keyframes twinkle{50%{transform:scale(.7) rotate(25deg)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes shine{0%,55%{transform:translateX(-167%) skewX(-18deg)}100%{transform:translateX(361%) skewX(-18deg)}}
@keyframes ping{from{transform:scale(1);opacity:.7}70%,100%{transform:scale(3);opacity:0}}
@keyframes wiggle{50%{transform:rotate(-3deg) scale(1.06)}}
@keyframes beat{50%{transform:scale(1.14)}}
@keyframes sheen{to{background-position:-300% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sp" viewBox="0 0 24 24"><path d="M12 1C13 8 16 11 23 12C16 13 13 16 12 23C11 16 8 13 1 12C8 11 11 8 12 1Z"/></symbol>
</svg>
<div id="spot" aria-hidden="true"></div>
<div id="deco" aria-hidden="true"></div>
<main>
  <header>
    <span class="brandwrap">
      <div class="brand">TARZ STORE</div>
      <svg class="spk a"><use href="#sp"/></svg>
      <svg class="spk b"><use href="#sp"/></svg>
    </span>
    <h1><i class="dot"></i><span id="count">Choose an app</span></h1>
    <p class="sub">Install the app, then get your free key.</p>
  </header>
  <div class="grid" id="list"><div class="sk"></div><div class="sk"></div></div>
</main>
<div class="tutwrap">
  <button type="button" class="tut" id="tutBtn" aria-haspopup="dialog"><span class="pl"><svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg></span>Tutorial Get Key</button>
  <a class="tut buy" href="https://tarzzstore.vercel.app/" target="_blank" rel="noopener"><span class="pl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg></span>BUY KEY VIP</a>
</div>
<div class="vmodal" id="vmodal" role="dialog" aria-modal="true" aria-label="Tutorial Get Key" hidden>
  <div class="vbox">
    <div class="vbar"><span>Tutorial Get Key</span><button type="button" class="vx" id="vclose" aria-label="Close video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
    <video id="vplayer" controls playsinline preload="none"></video>
  </div>
</div>
<div class="ticker-wrap">
  <div class="ticker"><div class="track" id="track"></div></div>
  <div class="ticker rev"><div class="track" id="track2"></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDxlcMvfZ1nhJ8WYbjR_y50N7EaY71gRIY",
  authDomain: "free-key-3024b.firebaseapp.com",
  projectId: "free-key-3024b",
  storageBucket: "free-key-3024b.firebasestorage.app",
  messagingSenderId: "766189284478",
  appId: "1:766189284478:web:524ba727e03eedde53bc2f"
};
// Cadangan: dipakai kalau database kosong / gagal dimuat. Daftar utama diatur dari admin2.html.
const FALLBACK = [
  { name: 'TARZ PROXY V1',   logo: 'https://i.ibb.co.com/YT3cv6Y3/product.jpg', install: 'https://www.mediafire.com/file/cw9f4lmkrwjx8ff/TarzProxy.apk/file', link: 'https://vplink.in/tarz1' },
  { name: 'TARZ MODZ PROXY', logo: 'https://i.ibb.co.com/bhf84LY/product.jpg',  install: 'https://www.mediafire.com/file/3wguz3vn187z1ch/Tarz_Modz_Proxy.release.apk/file', link: 'https://vplink.in/bhjfcff' },
  { name: 'TARZ X MODZ',     logo: 'https://i.ibb.co.com/gbv5tGt8/product.jpg', install: 'https://www.mediafire.com/file/pj1iipmidto2xr6/TARZ+MODZ+V3.apk/file', link: 'https://vplink.in/bhjjnbb' },
  { name: '8 BALL POOL V10', logo: 'https://i.ibb.co.com/674DCgnZ/product.jpg', install: 'https://www.mediafire.com/file/81gji9qdaqofycn/8+Ball+Poll+V10.apk/file', link: 'https://vplink.in/bhjcxxz' }
];

async function loadApps() {
  try {
    const snap = await Promise.race([
      getDocs(collection(getFirestore(initializeApp(firebaseConfig)), 'apps')),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))
    ]);
    const rows = snap.docs.map((x) => ({ id: x.id, ...x.data() }))
      .filter((r) => r.name && r.link && r.active !== false)
      .sort((a, b) => (a.order ?? Number(a.id)) - (b.order ?? Number(b.id)));
    return snap.empty ? FALLBACK : rows; // kalau semua dinonaktifkan, daftar kosong (bukan cadangan)
  } catch (e) { console.warn('Using fallback data:', e); return FALLBACK; }
}

const DOWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13M6 11l6 6 6-6M4 21h16"/></svg>';
const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg>';
const list = document.getElementById('list');
const apps = await loadApps();
list.innerHTML = '';
document.getElementById('count').textContent = apps.length ? apps.length + ' apps ready to use' : 'No apps yet';

apps.forEach((app, i) => {
  const a = document.createElement('div');
  a.className = 'tile';
  a.style.setProperty('--i', i);

  const tag = document.createElement('span');
  tag.className = 'free';
  tag.textContent = 'FREE';

  const logo = document.createElement('span');
  logo.className = 'logo';
  const img = new Image();
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';
  img.referrerPolicy = 'no-referrer';
  img.onerror = () => {
    img.remove();
    logo.textContent = app.name.split(' ').slice(0, 2).map((w) => w[0]).join('');
  };
  if (app.logo) { img.src = app.logo; logo.appendChild(img); } else img.onerror();

  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = app.name;

  const go = document.createElement('a');
  go.className = 'go';
  go.href = app.link;
  go.innerHTML = 'Get Key' + ARROW;

  const btns = document.createElement('div');
  btns.className = 'btns';
  if (app.install) {
    const ins = document.createElement('a');
    ins.className = 'go install';
    ins.href = app.install;
    ins.target = '_blank';
    ins.rel = 'noopener';
    ins.innerHTML = 'Install' + DOWN;
    btns.appendChild(ins);
  }
  btns.appendChild(go);

  a.append(tag, logo, name, btns);
  list.appendChild(a);

  // efek miring 3D mengikuti kursor (hanya perangkat dengan mouse)
  if (matchMedia('(hover:hover) and (pointer:fine)').matches) {
    a.addEventListener('pointermove', (e) => {
      const r = a.getBoundingClientRect();
      a.style.setProperty('--ry', ((e.clientX - r.left) / r.width - .5) * 10 + 'deg');
      a.style.setProperty('--rx', (.5 - (e.clientY - r.top) / r.height) * 10 + 'deg');
    });
    a.addEventListener('pointerleave', () => { a.style.setProperty('--rx', '0deg'); a.style.setProperty('--ry', '0deg'); });
  }
});

// Nama selalu 1 baris: kecilkan font otomatis kalau terlalu panjang.
// Dibaca dulu semua, baru ditulis semua (tanpa loop) supaya tidak memaksa reflow berulang.
function fitNames() {
  const els = [...document.querySelectorAll('.name')];
  els.forEach((el) => { el.style.fontSize = ''; el.style.display = 'block'; });
  const m = els.map((el) => ({ el, size: parseFloat(getComputedStyle(el).fontSize), sw: el.scrollWidth, cw: el.clientWidth }));
  m.forEach(({ el, size, sw, cw }) => {
    if (sw > cw && sw > 0) el.style.fontSize = Math.max(9, Math.floor(size * cw / sw * 2 - 0.01) / 2) + 'px';
  });
}
fitNames();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames);
// hanya saat LEBAR berubah (scroll di HP mengubah tinggi saat address bar naik/turun -> jangan hitung ulang)
let lastW = innerWidth, fitRaf = 0;
addEventListener('resize', () => {
  if (innerWidth === lastW) return;
  lastW = innerWidth;
  cancelAnimationFrame(fitRaf);
  fitRaf = requestAnimationFrame(fitNames);
});

// sorotan cahaya mengikuti kursor / sentuhan (transform + rAF, tidak menyentuh layout/paint)
const spot = document.getElementById('spot');
let sx = innerWidth / 2, sy = innerHeight * .2, spotRaf = 0;
const placeSpot = () => { spotRaf = 0; spot.style.transform = 'translate3d(' + sx + 'px,' + sy + 'px,0)'; };
placeSpot();
addEventListener('pointermove', (e) => {
  sx = e.clientX; sy = e.clientY;
  if (!spotRaf) spotRaf = requestAnimationFrame(placeSpot);
}, { passive: true });

// ---------- video tutorial ----------
const VIDEO_URL = 'https://www.image2url.com/r2/default/videos/1791217347389-40c7c65a-caba-4cbc-bb27-1a85657fc5c4.mp4';
const vmodal = document.getElementById('vmodal'), vplayer = document.getElementById('vplayer'), tutBtn = document.getElementById('tutBtn');
function openTut() {
  vplayer.src = VIDEO_URL;
  vmodal.hidden = false;
  document.documentElement.style.overflow = 'hidden';
  vplayer.play().catch(() => {}); // kalau diblokir browser, tombol play bawaan tetap bisa ditekan
  document.getElementById('vclose').focus();
}
function closeTut() {
  vplayer.pause();
  vplayer.removeAttribute('src');
  vplayer.load();
  vmodal.hidden = true;
  document.documentElement.style.overflow = '';
  tutBtn.focus();
}
tutBtn.addEventListener('click', openTut);
document.getElementById('vclose').addEventListener('click', closeTut);
vmodal.addEventListener('click', (e) => { if (e.target === vmodal) closeTut(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !vmodal.hidden) closeTut(); });

// ---------- dekorasi ----------
const burst = (n, ro, ri) => {
  let p = '';
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? ri : ro, a = (Math.PI * i) / n - Math.PI / 2;
    p += (50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1) + ' ';
  }
  return p;
};
const star = (c) => '<svg viewBox="0 0 100 100"><polygon points="' + burst(12, 46, 34) + '" style="--c:' + c + '"/></svg>';
const spark = '<svg viewBox="0 0 24 24" style="--c:var(--yellow)"><use href="#sp"/></svg>';
const zig = '<svg viewBox="0 0 100 30" style="fill:none;stroke:var(--yellow);stroke-width:5"><path d="M4 22 18 8 32 22 46 8 60 22 74 8 88 22"/></svg>';
const cloud = '<svg viewBox="0 0 120 80" style="--c:var(--white)"><path d="M30 64a20 20 0 0 1 0-40 26 26 0 0 1 48-6 20 20 0 0 1 14 46z"/></svg>';
const tri = '<svg viewBox="0 0 100 100" style="--c:var(--white)"><polygon points="50,10 92,86 8,86"/></svg>';
const plus = '<svg viewBox="0 0 100 100" style="--c:var(--yellow)"><path d="M38 6h24v32h32v24H62v32H38V62H6V38h32z"/></svg>';
const bolt = '<svg viewBox="0 0 100 100" style="--c:var(--yellow)"><path d="M60 4 18 56h26l-8 40 46-58H52z"/></svg>';
const DECO = [
  { cls: 'spin', html: star('var(--blue)'), css: 'width:120px;height:120px;left:-44px;top:-34px;--t:26s;opacity:.85' },
  { cls: 'spin', html: star('var(--yellow)'), css: 'width:44px;height:44px;right:12px;top:84px;--t:14s;animation-direction:reverse' },
  { cls: 'drift', html: cloud, css: 'width:104px;height:70px;left:-24px;top:300px;--t:11s' },
  { cls: 'drift', html: cloud, css: 'width:92px;height:62px;right:-22px;top:560px;--t:13s;animation-direction:alternate-reverse' },
  { cls: 'twinkle', html: spark, css: 'width:26px;height:26px;right:20px;top:330px;animation-delay:.6s' },
  { cls: 'bob half', html: '', css: 'width:90px;height:90px;right:-40px;top:430px;--t:6s' },
  { cls: 'bob check', html: '', css: 'width:64px;height:64px;left:-24px;bottom:210px;rotate:14deg;--t:7s' },
  { cls: 'bob', html: zig, css: 'width:88px;height:28px;right:16px;bottom:90px;--t:4.5s' }
];
const deco = document.getElementById('deco');
DECO.forEach((d) => {
  const el = document.createElement('div');
  el.className = 'o ' + d.cls;
  el.style.cssText = d.css;
  el.innerHTML = d.html;
  deco.appendChild(el);
});

// ---------- ticker ----------
const unit = (t) => Array.from({ length: 6 }, () => '<span>' + t + '</span><span>✦</span>').join('');
document.getElementById('track').innerHTML = unit('TARZ STORE') + unit('TARZ STORE');
document.getElementById('track2').innerHTML = unit('FREE KEY') + unit('FREE KEY');
